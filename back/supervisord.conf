[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/usr/src/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/usr/src/logs

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:runserver]
command=uvicorn main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*
autostart=true
autorestart=true
stdout_logfile=/usr/src/logs/runserver.log
stderr_logfile=/usr/src/logs/runserver_error.log

; Mundo compartido: sim autoritativa en Node (docs/mundo_compartido.md). Solo escucha en 127.0.0.1:8379;
; uvicorn le reenvía /api/ws. --watch reinicia al cambiar el archivo tras git pull (como --reload en uvicorn).
[program:mundo]
command=node --watch /usr/src/app/mundo/servidor.bundle.mjs
directory=/usr/src/app
environment=MUNDO_PUERTO="8379",MUNDO_HOST="127.0.0.1",MUNDO_DATOS="/usr/src/app/data",MUNDO_API="http://127.0.0.1:8000/api"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/usr/src/logs/mundo.log
stderr_logfile=/usr/src/logs/mundo_error.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
